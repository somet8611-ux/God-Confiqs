name: GOD CONFIQS PWA Preview

on:
  push:
    branches:
      - pwa-preview
    paths:
      - "miniapp/**"
      - ".github/workflows/pwa-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-preview"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload PWA files
        uses: actions/upload-pages-artifact@v3
        with:
          path: miniapp
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
